<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>生成登录校验密钥</title>
<style>body{max-width:720px;margin:10vh auto;padding:24px;font:16px/1.8 system-ui}textarea{width:100%;box-sizing:border-box;padding:16px;font:16px/1.6 monospace}button{font:inherit;padding:8px 20px;margin:16px 0}p{color:#555}</style>
<h1>生成登录校验密钥</h1><p>此页面在本机生成随机密钥，不发送网络请求。将生成结果填入 Cloudflare 的 OAUTH_STATE_SECRET，类型选 Secret。</p><button id="generate">生成随机密钥</button><textarea id="key" rows="3" readonly aria-label="随机密钥"></textarea><p>请将密钥保存在自己的密码管理器中。不要发到聊天或提交到 GitHub。</p>
<script>document.getElementById('generate').onclick=()=>{document.getElementById('key').value=Array.from(crypto.getRandomValues(new Uint8Array(32)),x=>x.toString(16).padStart(2,'0')).join('');document.getElementById('key').select();};</script></html>

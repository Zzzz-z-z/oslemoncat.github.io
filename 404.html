<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · oslemoncat 的知识库</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b6fd4'/%3E%3Ctext x='16' y='22' font-size='16' font-family='sans-serif' font-weight='bold' fill='%23fff' text-anchor='middle'%3EO%3C/text%3E%3C/svg%3E">
<script>
  (function () {
    try {
      var stored = localStorage.getItem('osc-theme');
      var theme = stored === 'light' || stored === 'dark'
        ? stored
        : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
    // 静态托管下，未知路径会落到这个页面。
    // 把路径转成 hash 路由，交给首页的 JS 决定渲染什么（找不到就显示「页面不存在」）。
    var path = location.pathname.replace(/\/+$/, '');
    var base = (document.baseURI || location.href).replace(/[^/]*$/, '');
    var basePath = new URL(base).pathname.replace(/\/+$/, '');
    if (basePath && path.indexOf(basePath) === 0) path = path.slice(basePath.length);
    location.replace(base + '#/notfound' + path);
  })();
</script>
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<header class="site-header" id="site-header"></header>
<main id="content"></main>
<footer class="site-footer" id="site-footer"></footer>
<script type="module" src="app.js"></script>
</body>
</html>
